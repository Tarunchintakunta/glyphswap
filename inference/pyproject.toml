[project]
name = "glyphswap-inference"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.17",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "mypy>=1.13", "ruff>=0.7"]
ml = [
  "torch>=2.5",
  "torchvision>=0.20",
  "paddlepaddle>=3.0",
  "paddleocr>=3.0",
  "python-doctr>=0.10",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glyphswap_inference"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2.*", "paddleocr.*", "doctr.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["models: needs downloaded weights or heavy OCR deps"]
testpaths = ["tests"]
